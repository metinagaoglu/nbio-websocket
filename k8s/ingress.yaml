apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nbio-websocket-ingress
  namespace: nbio-websocket
  labels:
    app: nbio-websocket
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # WebSocket specific annotations
    nginx.ingress.kubernetes.io/websocket-services: "nbio-websocket-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
    # Session affinity for WebSocket connections
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "nbio-websocket"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
spec:
  ingressClassName: nginx
  rules:
  - host: websocket.local
    http:
      paths:
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: nbio-websocket-service
            port:
              number: 8080
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: nbio-websocket-service
            port:
              number: 9090
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: nbio-websocket-service
            port:
              number: 9090
