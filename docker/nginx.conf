events {
    worker_connections 1024;
}

http {
    # Upstream configuration for WebSocket instances
    upstream websocket_backend {
        # Use ip_hash for sticky sessions (optional)
        # ip_hash;

        # WebSocket server instances
        # Add more servers as you scale
        server websocket:8080;
        # When using docker-compose scale, add more backends:
        # server websocket_2:8080;
        # server websocket_3:8080;
    }

    # WebSocket proxy configuration
    server {
        listen 80;
        server_name localhost;

        # WebSocket endpoint
        location /ws {
            proxy_pass http://websocket_backend;
            proxy_http_version 1.1;

            # WebSocket headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://websocket_backend/health;
            proxy_http_version 1.1;
        }

        # Metrics endpoint
        location /metrics {
            proxy_pass http://websocket_backend/metrics;
            proxy_http_version 1.1;
        }
    }
}
