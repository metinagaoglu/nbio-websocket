version: '3.8'

services:
  # WebSocket server
  websocket:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nbio-websocket
    restart: unless-stopped
    ports:
      - "8080:8080"  # WebSocket port
      - "9090:9090"  # Metrics port
    environment:
      # Server configuration
      - WS_HOST=0.0.0.0
      - WS_PORT=8080

      # Client configuration
      - WS_SEND_BUFFER=256
      - WS_PING_INTERVAL=10s
      - WS_PONG_TIMEOUT=60s
      - WS_MAX_MESSAGE_SIZE=1048576

      # Logging configuration
      - WS_LOG_LEVEL=info
      - WS_LOG_FORMAT=json

      # Security configuration
      - WS_AUTH_ENABLED=false
      - WS_RATE_LIMIT_ENABLED=false
      # - WS_BEARER_TOKENS=token1,token2
      # - WS_RATE_LIMIT_RATE=100
      # - WS_RATE_LIMIT_INTERVAL=1m
      # - WS_RATE_LIMIT_BURST=10

      # PubSub configuration (for horizontal scaling)
      - WS_PUBSUB_ENABLED=false
      # - WS_PUBSUB_ADAPTER=redis  # Options: local, redis, nats
      # - WS_REDIS_URL=redis://redis:6379/0
      # - WS_NATS_URL=nats://nats:4222
      # - WS_PUBSUB_CHANNEL=websocket.broadcast
    networks:
      - websocket-net
    # depends_on:
    #   - redis  # Uncomment when using Redis adapter
    #   - nats   # Uncomment when using NATS adapter
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.nbio-websocket.description=WebSocket server with nbio"
      - "com.nbio-websocket.version=1.0.0"

  # Redis for horizontal scaling with pub/sub
  # Uncomment to enable Redis adapter
  redis:
    image: redis:7-alpine
    container_name: nbio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - websocket-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  # NATS for horizontal scaling with pub/sub
  # Uncomment to enable NATS adapter
  nats:
    image: nats:2-alpine
    container_name: nbio-nats
    restart: unless-stopped
    ports:
      - "4222:4222"  # Client connections
      - "8222:8222"  # HTTP monitoring
    networks:
      - websocket-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: ["-js", "-m", "8222"]

  # Optional: Prometheus for metrics collection
  # Uncomment to enable monitoring
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: prometheus
  #   restart: unless-stopped
  #   ports:
  #     - "9091:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus-data:/prometheus
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #   networks:
  #     - websocket-net

  # Optional: Grafana for visualization
  # Uncomment to enable dashboards
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: grafana
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #   volumes:
  #     - grafana-data:/var/lib/grafana
  #   networks:
  #     - websocket-net
  #   depends_on:
  #     - prometheus

networks:
  websocket-net:
    driver: bridge

volumes:
  redis-data:
#   prometheus-data:
#   grafana-data:
